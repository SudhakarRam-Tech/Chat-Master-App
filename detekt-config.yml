build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    comments: 0

config:
  validation: true
  warningsAsErrors: false
  excludes: ""

processors:
  active: true

console-reports:
  active: true
  exclude:
    - ProjectStatisticsReport
    - ComplexityReport
    - NotificationReport

output-reports:
  active: true

comments:
  active: true

complexity:
  active: true

  CyclomaticComplexMethod:
    active: true
    threshold: 15

  CognitiveComplexMethod:
    active: true
    threshold: 15

  ComplexCondition:
    active: true
    threshold: 4

  LongMethod:
    active: true
    threshold: 100

  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreDataClasses: true

  LargeClass:
    active: true
    threshold: 600

  NestedBlockDepth:
    active: true
    threshold: 4

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true

formatting:
  active: true
  android: true
  autoCorrect: true

  FinalNewline:
    active: true

  Indentation:
    active: true

  MaximumLineLength:
    active: true
    maxLineLength: 120

  NoUnusedImports:
    active: true

  NoWildcardImports:
    active: false

  SpacingAroundColon:
    active: true

  SpacingAroundComma:
    active: true

  SpacingAroundCurly:
    active: true

  SpacingAroundKeyword:
    active: true

  SpacingAroundOperators:
    active: true

  TrailingCommaOnCallSite:
    active: true

  TrailingCommaOnDeclarationSite:
    active: true

naming:
  active: true

  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'

  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - Composable
      - Preview

  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'

  TopLevelPropertyNaming:
    active: true

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true

  MagicNumber:
    active: true
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true

  MaxLineLength:
    active: true
    maxLineLength: 120

  ReturnCount:
    active: true
    max: 3
    excludedFunctions:
      - equals

  ThrowsCount:
    active: true
    max: 2

  WildcardImport:
    active: false

  UnusedImports:
    active: true

  UnusedPrivateMember:
    active: true

libraries:
  active: true